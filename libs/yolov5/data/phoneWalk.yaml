# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: ../autodl-tmp/datasets/phoneWalk  # dataset root dir
train: tarin.txt  # train images (relative to 'path') 128 images
val: val.txt # val images (relative to 'path') 128 images

# Classes
names:
  0: Call
  1: PlayWithOneHand
  2: PlayWithTwoHands
  3: Stand
  4: Sit
  5: Photograph
  6: Other
